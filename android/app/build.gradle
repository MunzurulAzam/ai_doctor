def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.dev.dr_ai"
    compileSdkVersion 36
    ndkVersion "27.0.12077973"

    tasks.withType(JavaCompile).configureEach {
    it.sourceCompatibility = JavaVersion.VERSION_17
    it.targetCompatibility = JavaVersion.VERSION_17
}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.dev.dr_ai"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 23       // <-- Hardcoded here
        versionName "1.1.23"   // <-- Hardcoded here
    }

    // signingConfigs {
    //     release {
    //         // if (project.hasProperty("keyAlias")) {
    //         //     keyAlias project.keyAlias
    //         //     keyPassword project.keyPassword
    //         //     storeFile project.hasProperty("storeFile") ? file(project.storeFile) : null
    //         //     storePassword project.storePassword
    //         // }
    //     keyAlias keystoreProperties['keyAlias']
    //     keyPassword keystoreProperties['keyPassword']
    //     storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    //     storePassword keystoreProperties['storePassword']
    //     }
    // }

    buildTypes {
        release {
            // signingConfig signingConfigs.release
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source "../.."
}

dependencies {
  implementation(platform("com.google.firebase:firebase-bom:32.8.1"))
  implementation("com.google.firebase:firebase-analytics")
  implementation 'com.google.firebase:firebase-core:17.5.0'
  implementation 'com.google.firebase:firebase-messaging:20.2.4'
